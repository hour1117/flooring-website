backend:
  name: proxy
  proxy_url: http://localhost:8081/api/v1

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "en"

collections:
  - name: "categories"
    label: "Categories"
    label_singular: "Category"
    folder: "src/content/categories"
    create: true
    format: "json"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Icon", name: "icon", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  - name: "products"
    label: "Products"
    label_singular: "Product"
    folder: "src/content/products"
    create: true
    format: "json"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "relation", collection: "categories", search_fields: ["title"], value_field: "slug", display_fields: ["title"] }
      - { label: "Featured Image", name: "featured_image", widget: "image" }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        summary: "Image {{fields.image}}"
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Short Description", name: "short_description", widget: "text", i18n: true }
      - { label: "Full Description", name: "body", widget: "markdown", i18n: true }
      - label: "Specifications"
        name: "specs"
        widget: "list"
        i18n: true
        fields:
          - { label: "Spec Name", name: "name", widget: "string", i18n: true }
          - { label: "Spec Value", name: "value", widget: "string", i18n: true }
      - { label: "PDF Spec Sheet", name: "pdf_spec", widget: "file", required: false }
      - { label: "Video URL", name: "video_url", widget: "string", required: false }
      - { label: "Related Products", name: "related_products", widget: "relation", collection: "products", search_fields: ["title"], value_field: "slug", multiple: true, required: false }
      - { label: "Featured (Best Seller)", name: "is_featured", widget: "boolean", default: false }
      - { label: "SEO Title", name: "seo_title", widget: "string", required: false, i18n: true }
      - { label: "SEO Description", name: "seo_description", widget: "text", required: false, i18n: true }

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    format: "json"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "featured_image", widget: "image" }
      - { label: "Excerpt", name: "excerpt", widget: "text", i18n: true }
      - { label: "Body", name: "body", widget: "markdown", i18n: true }
      - { label: "Category", name: "category", widget: "select", options: ["Product Guide", "Industry News", "Case Study", "Installation Tips", "Maintenance"] }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "SEO Title", name: "seo_title", widget: "string", required: false, i18n: true }
      - { label: "SEO Description", name: "seo_description", widget: "text", required: false, i18n: true }

  - name: "projects"
    label: "Project Cases"
    folder: "src/content/projects"
    create: true
    format: "json"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Completion Date", name: "completion_date", widget: "datetime" }
      - { label: "Featured Image", name: "featured_image", widget: "image" }
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        field: { label: "Image", name: "image", widget: "image" }
      - { label: "Description", name: "body", widget: "markdown", i18n: true }
      - { label: "Products Used", name: "products_used", widget: "relation", collection: "products", search_fields: ["title"], value_field: "slug", multiple: true, required: false }

  - name: "certificates"
    label: "Certificates"
    folder: "src/content/certificates"
    create: true
    format: "json"
    i18n: false
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Issuing Body", name: "issuer", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", default: 0 }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "src/content/settings/site.json"
        format: "json"
        i18n: true
        fields:
          - { label: "Site Title", name: "site_title", widget: "string", i18n: true }
          - { label: "Site Description", name: "site_description", widget: "text", i18n: true }
          - { label: "Company Name", name: "company_name", widget: "string", i18n: true }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string" }
          - { label: "Address", name: "address", widget: "text", i18n: true }
          - { label: "Google Maps Embed URL", name: "maps_embed_url", widget: "string", required: false }
          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "Google Analytics ID", name: "ga_id", widget: "string", required: false }
